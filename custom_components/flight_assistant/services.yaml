add_flight:
  name: Add a flight
  description: Add a flight with per-trip transport preferences. PNR booking import is not yet available.
  fields:
    flight_number:
      required: true
      example: "SK345"
      selector:
        text:
    origin:
      required: true
      example: "TRD"
      selector:
        text:
    scheduled:
      required: true
      example: "2026-11-02T12:30:00+01:00"
      selector:
        text:
    destination:
      required: false
      example: "OSL"
      selector:
        text:
    arrival_scheduled:
      required: false
      example: "2026-11-02T13:30:00+01:00"
      selector:
        text:
    journey_type:
      required: false
      selector:
        select:
          options:
            - label: Innenlands
              value: domestic
            - label: Utenlands
              value: international
    transport_mode:
      required: false
      selector:
        select:
          options:
            - label: Sammenlign bil og kollektiv
              value: both
            - label: Jeg kjører selv
              value: drive
            - label: Kun kollektiv
              value: transit
    checked_bag:
      required: false
      default: false
      selector:
        boolean:
    airport_margin_minutes:
      required: false
      selector:
        number:
          min: 45
          max: 240
          step: 15
          unit_of_measurement: min
          mode: slider
    departure_address:
      required: false
      selector:
        text:
    departure_latitude:
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: 0.000001
          mode: box
    departure_longitude:
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: 0.000001
          mode: box
remove_flight:
  name: Remove a flight
  description: Remove a flight by its id from a Flight Assistant sensor attribute.
  fields:
    flight_id:
      required: true
      selector:
        text:
